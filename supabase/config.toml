# Avisa a lista de espera de um serviço que uma vaga abriu.
# A propria funcao valida a sessao e quem pode chamar (admin ou dono do grupo),
# entao o gateway nao precisa bloquear antes.
[functions.notify-service-watchers]
enabled = true
verify_jwt = false
entrypoint = "./functions/notify-service-watchers/index.ts"

[functions.grant-testimonial-reward]
enabled = true
verify_jwt = true
entrypoint = "./functions/grant-testimonial-reward/index.ts"

# Reconciliação de pagamentos ("paguei e não fui add ao grupo").
# Roda com `verify_jwt = false` (o cron manda o segredo guardado em
# app_settings, e segredo não é JWT — com verify_jwt = true o gateway
# responde 401 ANTES do código rodar e a reconciliação nunca acontece).
[functions.reconcile-payments]
enabled = true
verify_jwt = false
entrypoint = "./functions/reconcile-payments/index.ts"

# Exclusão de conta. É chamada pelo app com o JWT do próprio usuário, então
# aqui o gateway PODE (e deve) exigir o JWT.
[functions.delete-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

# ============================================================================
# PULSE CODING (revenda)
# ============================================================================
# [functions.pulse-admin]
# Painel do admin: saldo, sync do catálogo, remapeamento, dry_run.
# Chamado pelo navegador COM o JWT do admin, então o gateway exige o JWT
# (verify_jwt = true, o padrão do projeto).
[functions.pulse-admin]
enabled = true
verify_jwt = true
entrypoint = "./functions/pulse-admin/index.ts"

# [functions.pulse-webhook]
# A Pulse chama esta URL direto do servidor deles, sem sessão e sem JWT.
# Por isso verify_jwt = false E a validação acontece dentro do código, pelo
# header X-Pulse-Signature (HMAC-SHA256 do corpo cru).
[functions.pulse-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/pulse-webhook/index.ts"

# [functions.pulse-entrega]
# O cliente busca a SUA entrega com o próprio JWT. Aqui verify_jwt = true é o
# correto: quem chama é o navegador do cliente logado.
[functions.pulse-entrega]
enabled = true
verify_jwt = true
entrypoint = "./functions/pulse-entrega/index.ts"

# [functions.pulse-poll]
# Job de polling dos pedidos pendentes (rede de segurança do webhook).
# O cron manda o segredo guardado em app_settings, e segredo não é JWT —
# com verify_jwt = true o gateway responde 401 ANTES do código rodar.
[functions.pulse-poll]
enabled = true
verify_jwt = false
entrypoint = "./functions/pulse-poll/index.ts"
