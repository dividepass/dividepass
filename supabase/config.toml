# Webhook da Woovi (Pix Automático).
#
# verify_jwt = false é OBRIGATÓRIO: a Woovi chama essa URL direto do
# servidor deles, sem sessão e sem JWT. Com verify_jwt = true (padrão) o
# gateway do Supabase responde 401 e nenhuma confirmação de pagamento chega.
#
# A autenticação real da Woovi é o AppID no header `Authorization` da API
# deles — o webhook da Woovi manda o corpo do evento, e a gente valida o
# correlationID (que só o DividePass gera) antes de confirmar qualquer
# pagamento.
[functions.woovi-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/woovi-webhook/index.ts"

# Polling do status do pagamento (usado pelo checkout enquanto a aba está
# aberta). Aqui verify_jwt = true é o CORRETO: quem chama é o navegador do
# usuário logado, e a função valida o token antes de consultar a Woovi.
[functions.check-woovi-tx]
enabled = true
verify_jwt = true
entrypoint = "./functions/check-woovi-tx/index.ts"

# Teste de credencial da Woovi (botão "Testar" na tela de Configurações).
# O admin logado pede para testar um AppID contra a URL do ambiente escolhido.
# verify_jwt = true (padrão) é o correto: quem chama é o navegador do admin
# logado, e a função ainda checa `users.role = 'admin'` antes de responder.
[functions.woovi-teste-conexao]
enabled = true
verify_jwt = true
entrypoint = "./functions/woovi-teste-conexao/index.ts"

