# ---------------------------------------------------------------------------
# CRON -> EDGE FUNCTION (pg_cron + pg_net)
#
# O pg_cron dispara a função com `Authorization: Bearer <segredo>`, e o
# segredo guardado em app_settings NAO e um JWT. Com verify_jwt = true (padrao)
# o gateway do Supabase responde 401 UNAUTHORIZED_INVALID_JWT_FORMAT ANTES do
# codigo rodar — a funcao nunca executa e nenhuma cobranca recorrente acontece.
#
# A validacao real acontece dentro da propria funcao (ela aceita o segredo de
# app_settings OU o SERVICE_ROLE_KEY). Manter verify_jwt = false aqui e o que
# impede que um redeploy reabra esse bug — que ja aconteceu uma vez.
# ---------------------------------------------------------------------------
[functions.process-recurring-billing]
enabled = true
verify_jwt = false

[functions.update-subscription-statuses]
enabled = true
verify_jwt = false

# ---------------------------------------------------------------------------
# E-MAILS DE CICLO DE VIDA
#
# `send-lifecycle-emails` é chamada pelo pg_cron com `Authorization: Bearer
# <segredo>` — e segredo não é JWT. Com verify_jwt = true (padrão) o gateway
# do Supabase responde 401 ANTES do código rodar e o job nunca acontece.
# A validação real (SERVICE_ROLE_KEY, segredo do app_settings ou
# BILLING_CRON_SECRET) está dentro da própria função.
#
# `send-welcome-email` também fica com verify_jwt = false porque o front
# chama no login com o token do usuário — e a função valida a sessão dela
# mesma, ignorando o `user_id` do corpo nesse caso (ninguém consegue
# disparar e-mail em nome de outra pessoa).
# ---------------------------------------------------------------------------
[functions.send-lifecycle-emails]
enabled = true
verify_jwt = false

[functions.send-welcome-email]
enabled = true
verify_jwt = false

